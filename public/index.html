<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AL-HUDA Aiven DB Manager</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white font-sans min-h-screen">

  <!-- Security Authentication Section -->
  <div id="loginSection" class="flex items-center justify-center min-h-screen p-4">
    <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 w-full max-w-md shadow-2xl space-y-4">
      <h2 class="text-xl font-bold text-center text-emerald-400">Aiven Secure Login</h2>
      <p class="text-xs text-slate-400 text-center">Login using your official Aiven MySQL Credentials</p>
      
      <div class="space-y-3">
        <input id="host" type="text" placeholder="Host (e.g. mysql-xxx.aivencloud.com)" class="w-full p-2.5 bg-slate-900 border border-slate-700 rounded text-sm text-white focus:outline-none focus:border-emerald-500">
        <input id="port" type="number" placeholder="Port (e.g. 14363)" class="w-full p-2.5 bg-slate-900 border border-slate-700 rounded text-sm text-white focus:outline-none focus:border-emerald-500">
        <input id="user" type="text" placeholder="Username (avnadmin)" class="w-full p-2.5 bg-slate-900 border border-slate-700 rounded text-sm text-white focus:outline-none focus:border-emerald-500">
        <input id="password" type="password" placeholder="Aiven Password" class="w-full p-2.5 bg-slate-900 border border-slate-700 rounded text-sm text-white focus:outline-none focus:border-emerald-500">
        <input id="database" type="text" placeholder="Database Name (defaultdb)" class="w-full p-2.5 bg-slate-900 border border-slate-700 rounded text-sm text-white focus:outline-none focus:border-emerald-500">
        <button onclick="login()" class="w-full bg-emerald-600 hover:bg-emerald-500 py-2.5 rounded font-semibold text-sm transition">Secure Connect</button>
      </div>
    </div>
  </div>

  <!-- Main Database Manager Dashboard -->
  <div id="dashboardSection" class="hidden p-4 md:p-6 max-w-7xl mx-auto space-y-6">
    <!-- Top Header -->
    <div class="flex justify-between items-center bg-slate-800 p-4 rounded-xl border border-slate-700">
      <div>
        <h1 class="text-lg font-bold text-emerald-400">AL-HUDA DB Manager</h1>
        <p class="text-xs text-slate-400">Central Database Management Interface</p>
      </div>
      <button onclick="logout()" class="bg-rose-600 hover:bg-rose-500 px-4 py-2 rounded text-xs font-semibold">Disconnect</button>
    </div>

    <!-- Main Content Layout -->
    <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
      <!-- Left Sidebar: Tables List -->
      <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 space-y-3">
        <div class="flex justify-between items-center">
          <h3 class="font-bold text-xs text-slate-400 uppercase">Database Tables</h3>
          <button onclick="loadTables()" class="text-xs text-emerald-400 hover:underline">Refresh</button>
        </div>
        <ul id="tableList" class="space-y-1 text-sm text-slate-300 max-h-96 overflow-y-auto"></ul>
      </div>

      <!-- Right Main Panel -->
      <div class="md:col-span-3 space-y-6">
        <!-- SQL Command Execution & File Upload -->
        <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 space-y-3">
          <h3 class="font-bold text-sm text-slate-300">Run SQL Query / Create Table</h3>
          <textarea id="sqlQuery" rows="4" placeholder="CREATE TABLE users (...); OR SELECT * FROM users;" class="w-full p-3 bg-slate-900 border border-slate-700 rounded text-sm font-mono text-emerald-400 focus:outline-none"></textarea>
          
          <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
            <div class="flex items-center space-x-2">
              <input type="file" id="sqlFile" accept=".sql" class="text-xs text-slate-400">
              <button onclick="uploadSQL()" class="bg-blue-600 hover:bg-blue-500 px-3 py-1.5 rounded text-xs font-semibold">Upload SQL File</button>
            </div>
            <button onclick="runSQL()" class="bg-emerald-600 hover:bg-emerald-500 px-5 py-1.5 rounded text-xs font-semibold self-end sm:self-auto">Execute Query</button>
          </div>
        </div>

        <!-- Query Results / Output Viewer -->
        <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 space-y-3">
          <div class="flex justify-between items-center">
            <h3 class="font-bold text-sm text-slate-300">Output / Response</h3>
            <button onclick="downloadBackup()" class="bg-amber-600 hover:bg-amber-500 px-3 py-1 rounded text-xs font-semibold">Download Output (.json)</button>
          </div>
          <div id="outputArea" class="bg-slate-900 p-4 rounded-lg text-xs font-mono text-slate-300 overflow-x-auto min-h-[150px] max-h-[400px]">No data loaded yet. Select a table or run a query.</div>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
